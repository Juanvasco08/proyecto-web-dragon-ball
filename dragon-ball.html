<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ball API | Juan Manuel</title>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="dragon-ball" class="bg-slate-950 bg-tech-grid text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950 overflow-x-hidden">

    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
        <div class="absolute -top-48 -left-48 w-[500px] h-[500px] bg-amber-500/15 rounded-full blur-[120px]"></div>
        <div class="absolute top-1/3 -right-48 w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-[120px]"></div>
    </div>

    <div id="site-header"></div>

    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 py-12">
        <section class="animate-reveal text-center mb-10">
            <div class="inline-flex px-3.5 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-xs font-semibold tracking-wide uppercase mb-6">
                Dragon Ball API
            </div>
            <h1 class="font-display text-3xl sm:text-5xl font-bold text-white mb-3">Busca a tu guerrero</h1>
            <p class="text-slate-400 mb-8">Escribe un nombre y descubre su ki, sus transformaciones y su historia.</p>

            <form id="db-form" class="glass-panel rounded-2xl p-2 flex gap-2 max-w-xl mx-auto">
                <label for="db-search" class="sr-only">Nombre del personaje</label>
                <input id="db-search" type="search" placeholder="Ej: Goku, Vegeta, Freezer..." autocomplete="off" class="flex-1 bg-transparent px-4 py-3 text-white placeholder-slate-500 outline-none">
                <button type="submit" class="px-6 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 font-bold hover:shadow-lg hover:shadow-amber-500/25 active:scale-95 transition-all">Buscar</button>
            </form>
        </section>

        <p id="db-status" class="text-center text-slate-400 min-h-6 mb-6" aria-live="polite"></p>
        <div id="db-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4"></div>
    </main>

    <dialog id="db-modal" aria-labelledby="db-modal-title" class="m-auto w-[min(92vw,56rem)] max-h-[90vh] overflow-y-auto rounded-3xl border border-white/10 bg-slate-900 text-slate-100 p-0 backdrop:bg-slate-950/80 backdrop:backdrop-blur-sm">
        <div class="relative p-6 sm:p-8">
            <button type="button" id="db-modal-close" aria-label="Cerrar" class="absolute top-4 right-4 h-10 w-10 rounded-full bg-white/5 hover:bg-white/10 text-xl leading-none transition-colors">&times;</button>
            <div id="db-modal-body"></div>
        </div>
    </dialog>

    <div id="site-footer"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
